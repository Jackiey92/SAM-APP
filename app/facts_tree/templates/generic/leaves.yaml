# 通用事实模板包 generic —— 98 叶。由 09 设计稿 v1.2 §3 权威叶子表生成，勿手改。
# 字段：code 稳定编码 / title 叶子名 / shape n=叙述型 s=数据型 / scope 内容边界（装什么）。
pack: generic
version: 1
is_industry_pack: false
trunks:
